name: QA check (temporary)

# Runs only on the temporary qa/link-check branch: checks every external link and opens the
# live site on phone and desktop profiles, then saves the results to this branch.
on:
  push:
    branches: ["qa/link-check"]

permissions:
  contents: write

concurrency:
  group: qa-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every external link
        continue-on-error: true
        run: node qa/linkcheck.mjs index.html qa-results-links.json
      - name: Install Playwright
        continue-on-error: true
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Open the live site on phones and desktop
        continue-on-error: true
        run: python qa/live.py qa-results-live
      - name: Save the results to this branch
        if: always()
        run: |
          mkdir -p qa-results
          [ -f qa-results-links.json ] && mv qa-results-links.json qa-results/links.json
          [ -d qa-results-live ] && mv qa-results-live qa-results/live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-results
          git commit -m "QA results" || echo "nothing to commit"
          git push origin HEAD:qa/link-check
