name: QA rules check (temporary)

# Runs only on the temporary qa/link-check branch: tests the old and the proposed Firestore rules
# in the Firestore emulator, then saves the results to this branch.
on:
  push:
    branches: ["qa/link-check"]

permissions:
  contents: write

concurrency:
  group: qa-rules
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the emulator and the test library
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund firebase-tools@13 firebase@10.14.1 @firebase/rules-unit-testing@3.0.4
      - name: Old rules
        continue-on-error: true
        run: npx firebase emulators:exec --only firestore --project demo-wandering-eric "node qa/rules/test.mjs qa/rules/old.rules old" > qa-rules-old.log 2>&1 || true
      - name: New rules
        continue-on-error: true
        run: npx firebase emulators:exec --only firestore --project demo-wandering-eric "node qa/rules/test.mjs qa/rules/new.rules new" > qa-rules-new.log 2>&1 || true
      - name: Save the results to this branch
        if: always()
        run: |
          mkdir -p qa-results
          tail -c 4000 qa-rules-old.log > qa-results/rules-old.log 2>/dev/null || true
          tail -c 4000 qa-rules-new.log > qa-results/rules-new.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-results
          git commit -m "QA rules results" || echo "nothing to commit"
          git push origin HEAD:qa/link-check
